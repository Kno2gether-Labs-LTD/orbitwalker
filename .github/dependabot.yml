version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      androidx:
        patterns: ["androidx.*"]
    ignore:
      # Major Gradle / Android Gradle Plugin / Kotlin upgrades are done by hand and tested on glasses.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "androidx.compose:compose-bom"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
